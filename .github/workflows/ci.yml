name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [app, bot, worker, anime-schedule]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: ${{ matrix.service }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Test login configuration
        if: matrix.service == 'app'
        run: pnpm run test:auth
      - name: Test blue treasure-map detection
        if: matrix.service == 'bot'
        run: node --test treasure-map-blue.test.mjs

  build:
    name: Build portal
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production application
        run: pnpm build

  gathering:
    name: Test timed gathering
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gathering
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: gathering/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test

  anime-integration:
    name: Test schedule database fallback
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unit
          POSTGRES_PASSWORD: unit
          POSTGRES_DB: schedule_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unit -d schedule_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANIME_TEST_DATABASE_URL: postgresql://unit:unit@127.0.0.1:5432/schedule_test
    defaults:
      run:
        working-directory: anime-schedule
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: anime-schedule/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit and isolated database tests
        run: pnpm test
