name: Bug report
description: Report a reproducible problem with the portal, bot, worker, or installer.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private member data, database dumps, or security vulnerabilities. Use SECURITY.md for security reports.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Portal website
        - Discord bot
        - Background worker
        - Anime schedule
        - Setup or restore
        - Docker or networking
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release tag or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Deployment environment
      description: Docker host platform, access method, and browser or Discord client where relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, credentials, personal data, Discord IDs, hostnames, and private URLs before posting.
